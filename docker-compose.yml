name: invoice-flow

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_management}
      POSTGRES_USER: ${POSTGRES_USER:-invoice_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_management}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoice_app}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-invoice_management}?schema=public
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-invoice_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-ورود یکپارچه سازمانی}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      BANK_ENCRYPTION_KEY: ${BANK_ENCRYPTION_KEY:?Set BANK_ENCRYPTION_KEY in .env}
      BANK_ENCRYPTION_KEY_ID: ${BANK_ENCRYPTION_KEY_ID:-local-v1}
      STORAGE_DRIVER: local
      STORAGE_ROOT: /app/storage
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-10485760}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - document-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend

volumes:
  postgres-data:
  document-storage:

networks:
  frontend:
  backend:
    internal: true
