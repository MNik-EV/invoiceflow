name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: invoice_test
          POSTGRES_USER: invoice_test
          POSTGRES_PASSWORD: invoice_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice_test -d invoice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://invoice_test:invoice_test_password@127.0.0.1:5432/invoice_test?schema=public
      TEST_DATABASE_URL: postgresql://invoice_test:invoice_test_password@127.0.0.1:5432/invoice_test?schema=public
      SESSION_SECRET: ci-session-secret-with-more-than-thirty-two-characters
      SESSION_COOKIE_NAME: invoice_session
      AUTH_PROVIDER: local
      BANK_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BANK_ENCRYPTION_KEY_ID: ci-v1
      STORAGE_DRIVER: local
      STORAGE_ROOT: ./storage
      UPLOAD_MAX_FILE_BYTES: 10485760
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
